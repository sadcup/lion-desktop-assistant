<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOLT · 你的本地桌面助手</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><aside><a class="brand" href="/">◈ <b>BOLT</b><span>DESKTOP</span></a><button id="reset" class="new">＋ 新建对话</button><div class="nav-label">工作台</div><button class="nav active">◉　桌面对话</button><button class="nav observe" data-tool="system_info">◫　本机状态</button><button class="nav observe" data-tool="list_windows">▤　窗口列表</button><button class="nav observe" data-tool="screenshot">▣　查看桌面</button><div class="sidebar-bottom"><div class="model-icon">N</div><div><strong>Nemotron Bolt E4B</strong><small>本地模型 · RTX 4090</small></div><i id="connection"></i></div></aside><main><header><div><span class="breadcrumb">个人工作台 /</span> 桌面对话</div><span class="local"><i></i> 数据留在这台电脑</span></header><section id="welcome"><div class="eyebrow">YOUR PC. YOUR ASSISTANT.</div><h1>一句话，让电脑动起来<span>。</span></h1><p>找文件、看状态、打开应用，或者记下一闪而过的想法。<br>我就在你的 4090 上，随时待命。</p><div class="suggestions"><button data-prompt="查看这台电脑的CPU、内存、磁盘和显卡状态。"><span>◫</span><strong>电脑现在忙吗？</strong><small>查看内存、GPU 与磁盘余量</small></button><button data-prompt="在我的桌面查找文件名里包含性能或PERFORMANCE的报告。先列出桌面再选择关键词搜索。"><span>⌕</span><strong>帮我找份报告</strong><small>在桌面和项目中定位文件</small></button><button data-prompt="列出可以启动的应用，然后打开文件管理器。"><span>▤</span><strong>打开文件管理器</strong><small>调用这台 PC 上的真实应用</small></button><button data-prompt="创建一篇笔记，标题为今日灵感，正文是：让本地AI成为我的桌面搭档。"><span>✎</span><strong>把灵感记下来</strong><small>确认后保存为本地 Markdown</small></button></div><div class="capability-note"><span>◉ 原生工具调用</span><span>◉ 操作过程可见</span><span>◉ 键鼠与写入需确认</span></div></section><section id="conversation" aria-live="polite"></section><div id="working" hidden><span class="spinner"></span><span id="working-label">BOLT 正在思考并操作工具…</span><span class="dots">···</span></div><div id="pending"></div><div class="composer-wrap"><form id="composer"><textarea id="message" rows="1" placeholder="告诉 BOLT，你想让这台电脑做什么…" aria-label="给助手的指令" maxlength="4000"></textarea><div class="composer-bottom"><span>◈　Nemotron Bolt E4B <span class="separator">·</span> <span id="metrics">本地运行</span></span><button id="send" type="submit" aria-label="发送消息">↑</button></div></form><div class="hint">Enter 发送 · Shift + Enter 换行 <span>工具执行结果会在对话中展示</span></div></div></main><div id="toast" role="status"></div><dialog id="preview"><button id="close-preview">关闭 ×</button><img id="preview-image" alt="桌面截图"><p id="preview-caption"></p></dialog></body></html>
